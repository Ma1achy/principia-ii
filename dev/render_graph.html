<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Principia · M7 render graph harness</title>
    <style>
      body { font: 13px/1.4 monospace; margin: 16px; display: flex; gap: 24px;
             background: #111; color: #ddd; }
      canvas { image-rendering: pixelated; border: 1px solid #444; }
      #controls { min-width: 340px; max-width: 480px; }
      label { display: block; margin: 6px 0; }
      select, input[type=range] { font: inherit; width: 220px; }
      #log { max-height: 280px; overflow-y: auto; background: #000; padding: 4px;
             white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="grid"></canvas>
    <div id="controls">
      <h3>M7 render graph — render-only mode/palette switching</h3>
      <label>colour <select id="colour"></select></label>
      <label>brightness <select id="brightness"></select></label>
      <label>combiner <select id="combiner"></select></label>
      <label>CVD <select id="cvd"></select></label>
      <label>palette <select id="palette"></select></label>
      <label>vMF κ <input id="kappa" type="range" min="0.5" max="12" step="0.5" value="3" /></label>
      <label>vMF chroma <input id="chroma" type="range" min="0.05" max="0.22" step="0.01" value="0.15" /></label>
      <label>vMF lightness <input id="lightness" type="range" min="0.35" max="0.9" step="0.05" value="0.7" /></label>
      <pre id="log"></pre>
    </div>
    <!-- Vite resolves @/ via the alias in vite.config.ts; shaders import as ?raw. -->
    <script type="module" src="./render_graph.ts"></script>
  </body>
</html>
